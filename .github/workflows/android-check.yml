name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and test Android app
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease
